# ---------------------------------------------------------------------------
# Source definitions. Turn sources on/off and tune parsing rules here.
#
# Only authorized channels are used:
#   - email alerts you subscribed to (received in your own inbox)
#   - official APIs (Adzuna, France Travail)
#   - RSS feeds published by the site
# No scraping of job sites.
#
# Check a rule on a real email with:  python -m job_hunter parse-eml <file.eml>
# ---------------------------------------------------------------------------

email:
  enabled: true
  mailbox: "INBOX"
  lookback_days: 2

  # Link texts that are never job titles (case-insensitive substring match).
  ignore_link_texts:
    - unsubscribe
    - désabonner
    - désinscrire
    - voir toutes
    - see all
    - see matching
    - view all
    - gérer
    - manage
    - paramètres
    - settings
    - confidentialité
    - privacy

  # ------------------------------------------------------------------------
  # One entry per job site. Keys:
  #   sender_patterns   : substrings of the From address (only alert senders!)
  #   subject_patterns  : optional regex the subject must match
  #   mode              : links (digest of several jobs) | single (one offer per email)
  #   body              : text | html - which part of the email to read
  #   job_url_patterns  : regex - a link is a job if its (decoded) URL matches
  #   job_id_pattern    : regex with one group: the site's job id
  #   canonical_url     : stable URL built from the id, e.g. https://site/jobs/{id}
  #   unwrap_redirects  : decode click-tracking redirects to the real job URL
  #   title_first       : true = first line of the block is the title
  #   skip_line_patterns: lines to drop (buttons, badges, headers)
  #   line_patterns     : regex with named groups -> fields. Recognised names:
  #                       company, location, salary_text, remote_text, contract,
  #                       posted_text ("il y a 3 jours" -> publication date);
  #                       any other name is kept in raw details.
  #   context_fields    : names for the leftover lines, in order
  #   default_contract  : contract implied by the site itself (e.g. Malt = freelance)
  #   salary_may_be_estimate: the site says it estimates missing salaries
  # ------------------------------------------------------------------------
  sites:

    # Verified on real alerts (Nov 2026): text part, details ABOVE the link.
    indeed:
      sender_patterns: ["jobalert.indeed.com"]
      body: text
      job_url_patterns: ['indeed\.[a-z.]+/(rc/clk|pagead/clk|viewjob|m/viewjob)']
      job_id_pattern: '[?&]jk=([0-9a-f]+)'
      canonical_url: "https://fr.indeed.com/viewjob?jk={id}"
      title_first: true
      skip_line_patterns: ['^Indeed Job Alert$', 'nouveaux? emplois', '^Jobs \d+-\d+ of']
      line_patterns:
        - '^(?P<company>.+?) - (?P<location>[^-]+)$'
        - '^(?P<salary_text>(De |Jusqu|À partir|A partir|\d).*€.*)$'
        - '^(?P<posted_text>il y a .+|Publiée .+|Aujourd.hui|Just posted|\d+\+? (jours?|days?) ago)$'
      salary_may_be_estimate: true   # Indeed's footer says missing salaries are estimated

    # Verified on real alerts (Nov 2026): text part, blocks separated by dashes.
    linkedin:
      sender_patterns: ["jobalerts-noreply@linkedin.com"]
      body: text
      job_url_patterns: ['linkedin\.com/(comm/)?jobs/view/\d+']
      job_id_pattern: 'jobs/view/(\d+)'
      canonical_url: "https://www.linkedin.com/jobs/view/{id}"
      title_first: true
      skip_line_patterns:
        - '^Votre alerte Emploi'
        - '^Your job alert'
        - '^Cette entreprise recrute'
        - '^Postulez avec'
        - '^Candidature simplifiée'
        - "^Voir l.offre"
        - '^-{5,}$'
      context_fields: [company, location]

    # Verified on real alerts (Nov 2026): HTML part, tracking redirects with the
    # real URL base64-encoded inside; details BELOW the title.
    hellowork:
      sender_patterns: ["notification@emails.hellowork.com"]
      body: html
      unwrap_redirects: true
      job_url_patterns: ['hellowork\.com/[a-z-]+/emplois/\d+']
      job_id_pattern: 'emplois/(\d+)'
      canonical_url: "https://www.hellowork.com/fr-fr/emplois/{id}.html"
      title_first: false
      skip_line_patterns: ['^Super recruteur$', "^Voir l.offre$", '^\|$']
      line_patterns:
        - '^(?P<contract>CDI|CDD|Freelance|Intérim|Interim|Stage|Alternance|Indépendant|Saisonnier)$'
        - '^(?P<salary_text>[\d  ]+.*€.*)$'
        - '^(?P<location>.+ - (\d{2,3}|2A|2B))$'
      context_fields: [company]

    # Verified on real newsletters (Nov 2026): text part, contract line BEFORE the title.
    free_work:
      sender_patterns: ["@free-work.com"]
      body: text
      job_url_patterns: ['free-work\.com/[a-z-]+/[a-z-]+/job-mission/']
      title_first: false
      skip_line_patterns: ['^Postuler$', '^<<.*>>$']
      line_patterns:
        - '^(?P<contract>Freelance|CDI|CDD|Stage|Alternance)$'
        - '^💶\s*(?P<salary_text>.+)$'
        - '^📍\s*(?P<location>.+)$'

    # Verified on real emails (Oct 2026): one client offer per email.
    malt:
      sender_patterns: ["noreply@malt.com"]
      subject_patterns: ['opportunit']
      mode: single
      job_url_patterns: ['malt\.[a-z]+/messages/client-project-offer/']
      job_id_pattern: 'client-project-offer/([0-9a-f]+)'
      canonical_url: "https://www.malt.fr/messages/client-project-offer/{id}"
      title_selector: "p.opportunity-name"
      subject_fields: 'avec (?P<company>.+)$'
      labels:
        Lieu: location
        Télétravail: remote_text
        Tarif journalier initial: salary_text
        Durée: duration
        Début: start
        Nombre de jours de travail: workload
        Description: description
      default_contract: freelance   # Malt only carries freelance missions

    # ---- Not yet verified: no alert from these sites in your inbox yet. ----
    efinancialcareers:
      sender_patterns: ["efinancialcareers"]
      subject_patterns: ['job|emploi|offre']
      job_url_patterns: ['efinancialcareers\.[a-z.]+/jobs-']
      job_id_pattern: 'id(\d{6,})'
    apec:
      sender_patterns: ["apec.fr"]
      job_url_patterns: ['apec\.fr/.*(detail-offre|offre)']
    monster:
      sender_patterns: ["monster"]
      job_url_patterns: ['monster\.[a-z.]+/(emploi|job|offre)']
    welcome_to_the_jungle:
      sender_patterns: ["welcometothejungle.com"]
      subject_patterns: ['offre|job|poste']
      job_url_patterns: ['welcometothejungle\.com/.*/jobs/']

adzuna:
  enabled: true
  base_url: "https://api.adzuna.com/v1/api/jobs"
  results_per_page: 50
  max_pages: 2

france_travail:
  # Off until you have API credentials.
  enabled: false
  token_url: "https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=%2Fpartenaire"
  search_url: "https://api.francetravail.io/partenaire/offresdemploi/v2/offres/search"
  scope: "api_offresdemploiv2 o2dsoffre"
  page_size: 150

rss:
  enabled: false
  feeds: []
